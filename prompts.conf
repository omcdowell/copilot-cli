# Substrate prompt copy for `copilot-cli serve`.
#
# Reloaded on the next chat turn when this file changes — no pip install, no
# server restart. Override the path with COPILOT_CLI_PROMPTS=/path/to/file
# (or COPILOT_CLI_PROMPTS=defaults to ignore this file).
#
# use_client_system_prompt = true  → wrap Pi's system message as session context
# use_client_system_prompt = false → use [pi_system] below, filling {{pi.*}}
#   from Pi's system message (tools, guidelines, docs paths, AGENTS.md, skills, cwd)

[settings]
use_client_system_prompt = false
local_tools_heading = ## Local tools
session_context_heading = ## Session context
user_request_heading = ## User request
user_role_prefix = [User]:
assistant_role_prefix = [Assistant]:

[local_tools_overlay]
You have access to the tools listed below. They run on the user's machine; they are not Microsoft 365 Copilot's built-in workplace tools. When (and only when) you need to call a tool, reply with ONLY one or more fenced code blocks, each tagged `tool_call` and containing a single JSON object of this exact form:

```tool_call
{"name": "<tool_name>", "arguments": { ... }}
```

To call several tools at once, emit several such blocks back to back, one JSON object each, and nothing else around them. Do not add any prose before, between, or after the blocks when calling tools. If you do not need a tool, reply normally with your answer.

[recency_footer]
If you need a local tool, reply with only ```tool_call fences.

[continuation_reminder]
Continue making any necessary follow-up ```tool_call requests until you have completed the task.

[pi_system]
